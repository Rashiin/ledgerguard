# Chooses the model client. The LLM_CLIENT environment variable overrides `client`.
#   local              Ollama on this machine. The default. Nothing leaves the machine.
#   openai_compatible  Any OpenAI-style endpoint. Optional and never required.
#   replay             Recorded responses. No model server and no network.
client: local

# A malformed ActionIntent is retried at most twice, with the schema error sent
# back unchanged. After that the turn fails visibly. Output is never repaired.
max_intent_retries: 2

local:
  base_url: http://localhost:11434
  model: qwen2.5:7b-instruct
  request_timeout_seconds: 120
  temperature: 0
  num_ctx: 8192

openai_compatible:
  base_url: null
  model: null
  api_key_env: OPENAI_API_KEY

replay:
  cassette_dir: fixtures/llm_cassettes
