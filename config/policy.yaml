# Permission policy. The app validates this file at startup and refuses to start
# if a value is missing, unknown or out of range.
#
# Some invariants are in code so that this file cannot weaken them. Payments and
# accepting a financing offer are always T3. A BLOCK is never overridden.
version: 1
currency: EUR

# Money leaving the business above this amount is blocked. Recording money
# received has no ceiling. It is bounded by what the invoice still owes.
# Amounts are quoted strings because YAML numbers are floats.
outbound_ceiling: "150000.00"

t3:
  cool_off_seconds: 60
  require_typed_confirmation: true

# The lowest balance an outbound payment may leave on each account.
account_floors:
  acc_operating: "5000.00"
  acc_petty_cash: "100.00"

rules:
  duplicate_payment_window_days: 14
  payroll_lead_days: 5
  tax_reserve_horizon_days: 45
  concentration_warning_share: "0.30"
  # The payroll and tax rules judge projected cash on contracted lines plus the
  # order book. The speculative seasonal fill never justifies a payment.
  protection_band: with_expected
  payroll_margin_warning: "0.20"
